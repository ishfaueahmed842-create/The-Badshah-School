<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | SMPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" onsubmit="studentLogin(event)">
      <div class="brand" style="margin-bottom:16px">
        <div class="logo">SM</div>
        <h1>Student Login<span>The Smart Modern Public School</span></h1>
      </div>
      <p style="color:#64748b;margin-bottom:12px">Demo: <strong>S1001</strong> / <strong>student123</strong></p>
      <label>Student ID or Email</label>
      <input name="studentId" required placeholder="S1001">
      <label>Password</label>
      <input name="password" type="password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <a class="btn btn-outline" href="index.html">Back to website</a>
      <a href="admin-login.html" style="text-align:center;color:#0b3d91;font-weight:700">Admin login instead</a>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
